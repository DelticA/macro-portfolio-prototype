[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-portfolio"
version = "0.1.0"
description = "Macro regime-aware permanent portfolio prototype for US and China assets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "uvicorn>=0.42",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
